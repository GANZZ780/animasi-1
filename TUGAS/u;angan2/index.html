<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Siswa Baru</title>
    <style>

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(to right, #f9f9f9, #e0eafc);
        color: #333;
        margin: 0;
        padding: 0;
    }

    .title {
        text-align: center;
        font-size: 2.5em;
        color: #0a3d62;
        margin-top: 30px;
    }

    .logo-container {
        text-align: center;
        margin: 20px 0;
    }

    .description {
        text-align: center;
        font-size: 1.2em;
        margin-bottom: 20px;
        color: #2c3e50;
    }

    form {
        max-width: 700px;
        background: #fff;
        padding: 30px;
        margin: 0 auto 40px;
        
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }


    fieldset {
        border: 2px solid #2980b9;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 30px;
    }

    legend {
        font-weight: bold;
        font-size: 1.2em;
        color: #2980b9;
        padding: 0 10px;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    select,
    textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1em;
        box-sizing: border-box;
    }

    textarea {
        height: 100px;
    }

    .radio-group {
        display: flex;
        gap: 20px;
        margin-top: 5px;
    }

    button {
        background-color: #2980b9;
        color: white;
        border: none;
        padding: 12px 25px;
        font-size: 1em;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 20px;
        transition: background-color 0.3s ease;
    }

    button:hover {
        background-color: #1c5980;
    }

    marquee {
        display: block;
        font-weight: bold;
        font-size: 1.2em;
        color: #c0392b;
        background-color: #fef9e7;
        padding: 10px 0;
        margin-bottom: 30px;
    }

    .audio-player {
        text-align: center;
        margin-bottom: 40px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    table, th, td {
        border: 1px solid #7f8c8d;
    }

    th, td {
        padding: 12px;
        text-align: center;
    }

    th {
        background-color: #2980b9;
        color: white;
    }

    tr:nth-child(even) {
        background-color: #f2f2f2;
    }

    tr:hover {
        background-color: #d1ecf1;
    }
</style>

</head>
<body>
    <h1 class="title">Formulir Pendaftaran Siswa Baru</h1>
    <div class="logo-container">
        <img width="20%" src="logo-si.png" alt="Logo Sekolah">
    </div>
    <p class="description">Silakan isi formulir di bawah ini dengan data yang benar dan lengkap.</p>
    <hr>

    <form>
        <fieldset>
            <legend>Data Siswxa</legend>

            <label for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" name="fullname">

            <label for="nisn">NISN:</label>
            <input type="number" id="nisn" name="nisn">

            <label>Jenis Kelamin:</label>
            <div class="radio-group">
                <label><input type="radio" name="kelamin" value="laki laki"> Laki-laki</label>
                <label><input type="radio" name="kelamin" value="laki laki"> perempuan</label>
            </div>

            <label for="tanggal">Tanggal Lahir:</label>
            <input type="date" id="tanggal" name="tanggal">

            <label for="jurusan">Jurusan:</label>
            <select name="jurusan" id="jurusan">
                <option value="RPL">RPL</option>
                <option value="DKV">DKV</option>
                <option value="MM">MM</option>
            </select>

            <label for="alamat">Alamat:</label>
            <textarea name="alamat" id="alamat"></textarea>

            <button type="submit">Daftar</button>
        </fieldset>
    </form>

    <marquee>Selamat datang di halaman pendaftaran siswa baru RPL</marquee>

    <div class="audio-player">
        <audio controls autoplay loop src="WhatsApp Audio 2025-07-28 at 21.10.29_70cbc364.mp3"></audio>
    </div>

    <fieldset>
        <legend>Informasi Jurusan</legend>
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Jurusan</th>
                    <th>Keterangan</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1.</td>
                    <td>RPL</td>
                    <td>Rekayasa Perangkat Lunak</td>
                </tr>
                <tr>
                    <td>2.</td>
                    <td>TKJ</td>
                    <td>Teknik Komputer Jaringan</td>
                </tr>
                <tr>
                    <td>3.</td>
                    <td>MM</td>
                    <td>Multimedia</td>
                </tr>
            </tbody>
        </table>
    </fieldset>
</body>
</html>
