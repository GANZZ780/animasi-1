<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mobil Berjalan</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: skyblue;
    }

    .road {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100px;
      background: #444;
    }

    .car {
      position: absolute;
      bottom: 100px;
      left: -150px;
      width: 120px;
      height: 60px;
      background-color: red;
      border-radius: 10px;
      animation: moveCar 5s linear infinite;
    }

    .wheel {
      position: absolute;
      bottom: -10px;
      width: 20px;
      height: 20px;
      background: black;
      border-radius: 50%;
    }

    .wheel.front {
      left: 20px;
    }

    .wheel.back {
      right: 20px;
    }

    @keyframes moveCar {
      0% { left: -150px; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div class="road"></div>
  <div class="car">
    <div class="wheel front"></div>
    <div class="wheel back"></div>
  </div>
</body>
</html>
