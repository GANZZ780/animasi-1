<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Neon Shooter 3D (Stickman + Mouse Look)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --cyan:#00ffff; --bg:#000; --hud:#8ef; --danger:#ff4d4d; }
    html,body{height:100%}
    body{margin:0; overflow:hidden; background:var(--bg); font-family: ui-monospace, Menlo, Consolas, monospace;}
    canvas{display:block}

    /* HUD */
    #hud{
      position:absolute; top:12px; left:12px; color:var(--hud);
      background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.12);
      border-radius:10px; padding:10px 12px; letter-spacing:.3px; backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(0,255,255,.12) inset; font-size:16px;
    }
    #crosshair{
      position:absolute; width:14px; height:14px; border:2px solid var(--cyan); border-radius:50%;
      left:50%; top:50%; transform:translate(-50%,-50%); pointer-events:none; box-shadow: 0 0 12px rgba(0,255,255,.4);
    }

    /* Overlays */
    .overlay{
      position:absolute; inset:0; display:grid; place-items:center; text-align:center; color:#fff;
      background: radial-gradient(1200px 600px at 50% -10%, rgba(0,255,255,.12), transparent 70%), rgba(0,0,0,.55);
    }
    #startOverlay h1{margin:0 0 10px; font-size:28px; color:#bff; text-shadow: 0 0 18px rgba(0,255,255,.35)}
    #startOverlay p{opacity:.9; margin:0 0 18px;}
    #gameover{display:none}
    #gameover h2{font-size:40px; margin:0 0 10px; color:var(--danger); text-shadow: 0 0 18px rgba(255,77,77,.45)}
    #gameover p{margin:0 0 14px}

    button{
      appearance:none; border:none; cursor:pointer; padding:10px 16px; border-radius:10px; font-weight:800;
      background:var(--cyan); color:#001; box-shadow: 0 6px 18px rgba(0,255,255,.25);
      transition: transform .06s ease;
    }
    button:active{ transform: scale(.98) }
  </style>
</head>
<body>
  <div id="hud">🎯 Score: 0 | ❤️ Health: 100 | ⚡ Level: 1</div>
  <div id="crosshair"></div>

  <div id="startOverlay" class="overlay">
    <div>
      <h1>Neon Shooter 3D</h1>
      <p>Gerak: WASD / ⬅️⬆️➡️⬇️ — Arahkan mouse untuk bidik — Klik kiri untuk tembak.</p>
      <button id="startBtn">▶️ Start Game</button>
    </div>
  </div>

  <div id="gameover" class="overlay">
    <div>
      <h2>💀 GAME OVER 💀</h2>
      <p id="finalScore">Score: 0 | Level: 1</p>
      <button id="restartBtn">↻ Restart</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    // ====== THREE BASICS ======
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.03);

    const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 2000);
    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    // Neon grid floor
    const grid = new THREE.GridHelper(52, 52, 0x00ffff, 0x00ffff);
    grid.material.opacity = 0.25; grid.material.transparent = true;
    scene.add(grid);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(60,60),
      new THREE.MeshStandardMaterial({ color:0x061a1a, metalness:0.6, roughness:0.4, emissive:0x001818, emissiveIntensity:0.7 })
    );
    floor.rotation.x = -Math.PI/2; scene.add(floor);

    // Lights
    const keyLight = new THREE.PointLight(0x66ffff, 1.2, 120); keyLight.position.set(10,14,10); scene.add(keyLight);
    const rimLight = new THREE.PointLight(0xff5580, 0.7, 120); rimLight.position.set(-12,10,-10); scene.add(rimLight);
    scene.add(new THREE.AmbientLight(0x1a1a1a, 1.0));

    // ====== PLAYER (Stickman) ======
    const stickman = new THREE.Group();

    // Kepala
    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.4,16,16),
      new THREE.MeshStandardMaterial({ color:0xffddaa, emissive:0x222222 })
    );
    head.position.y = 1.6;
    stickman.add(head);

    // Badan
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(0.6,1,0.4),
      new THREE.MeshStandardMaterial({ color:0x00aaff, emissive:0x004466 })
    );
    body.position.y = 0.9;
    stickman.add(body);

    // Tangan kiri
    const armL = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12,0.12,0.8,12),
      new THREE.MeshStandardMaterial({ color:0x00aaff, emissive:0x004466 })
    );
    armL.position.set(-0.5,1.1,0);
    stickman.add(armL);

    // Tangan kanan
    const armR = armL.clone();
    armR.position.x = 0.5;
    stickman.add(armR);

    // Kaki kiri
    const legL = new THREE.Mesh(
      new THREE.CylinderGeometry(0.15,0.15,0.9,12),
      new THREE.MeshStandardMaterial({ color:0x333333, emissive:0x111111 })
    );
    legL.position.set(-0.2,0.2,0);
    stickman.add(legL);

    // Kaki kanan
    const legR = legL.clone();
    legR.position.x = 0.2;
    stickman.add(legR);

    scene.add(stickman);
    const player = stickman;
    player.userData = { armL, armR, legL, legR };

    // Camera follow
    camera.position.set(0, 9, 13);
    camera.lookAt(player.position);

    // ====== INPUT ======
    const keys = {};
    addEventListener('keydown', e => keys[e.key] = true);
    addEventListener('keyup',   e => keys[e.key] = false);
    // Prevent arrow keys scrolling
    addEventListener('keydown', e => {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    }, { passive:false });

    const crosshair = document.getElementById('crosshair');
    const mouseNDC = new THREE.Vector2(0,0);
    const raycaster = new THREE.Raycaster();
    const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
    const aimPoint = new THREE.Vector3();

    function onPointerMove(e){
      const x = (e.clientX / innerWidth) * 2 - 1;
      const y = -(e.clientY / innerHeight) * 2 + 1;
      mouseNDC.set(x,y);
      crosshair.style.left = e.clientX + 'px';
      crosshair.style.top  = e.clientY + 'px';
    }
    addEventListener('mousemove', onPointerMove);
    addEventListener('touchmove', (e) => {
      const t = e.touches[0]; if(!t) return;
      onPointerMove({ clientX:t.clientX, clientY:t.clientY });
    }, { passive:true });

    // ====== LOOK AT MOUSE (nengok) ======
    function updateAimPoint(){
      raycaster.setFromCamera(mouseNDC, camera);
      // Dapetin titik bidik di bidang tanah
      if (raycaster.ray.intersectPlane(groundPlane, aimPoint)) {
        const dir = new THREE.Vector3().subVectors(aimPoint, player.position).setY(0);
        if (dir.lengthSq() > 1e-6) {
          player.rotation.y = Math.atan2(dir.x, dir.z); // nengok ke arah mouse
        }
      }
    }

    // ====== BULLETS ======
    const bullets = [];
    let lastShot = 0;
    const fireRate = 8; // peluru per detik
    function shoot(){
      const now = performance.now();
      if (now - lastShot < 1000/fireRate) return;
      lastShot = now;

      // arah tembakan = dari player ke aimPoint
      updateAimPoint();
      const dir = new THREE.Vector3().subVectors(aimPoint, player.position).setY(0).normalize();
      if (!isFinite(dir.lengthSq()) || dir.lengthSq() === 0) return;

      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 10, 10),
        new THREE.MeshStandardMaterial({ color:0xffff88, emissive:0xffff66, emissiveIntensity:0.9 })
      );
      mesh.position.copy(player.position).add(new THREE.Vector3(0,0.9,0)).add(dir.clone().multiplyScalar(0.8));
      mesh.userData = { vel: dir.multiplyScalar(0.9), born: now, life: 1800, radius: 0.2 };
      scene.add(mesh); bullets.push(mesh);
    }
    addEventListener('mousedown', (e)=>{ if(e.button===0) shoot(); });
    addEventListener('touchstart', (e)=>{ shoot(); }, { passive:true });
    addEventListener('keydown', (e)=>{ if(e.code==='Space') shoot(); });
    addEventListener('contextmenu', e => e.preventDefault());

    // ====== ENEMIES ======
    const enemies = [];
    function spawnEnemy(){
      const angle = Math.random()*Math.PI*2;
      const R = 26;
      const mesh = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.7, 0),
        new THREE.MeshStandardMaterial({ color:0xff3344, emissive:0xff0000, emissiveIntensity:0.9, metalness:0.15, roughness:0.35 })
      );
      mesh.position.set(Math.cos(angle)*R, 0.7, Math.sin(angle)*R);
      const base = 0.045 + level*0.008 + Math.random()*0.02;
      mesh.userData = { speed: base, radius: 0.8, hp: 1 };
      scene.add(mesh); enemies.push(mesh);
    }

    // Difficulty scaling
    let spawnInterval = 1400; // ms
    let lastSpawn = 0;

    function tickSpawner(now){
      if (now - lastSpawn > spawnInterval){
        spawnEnemy();
        lastSpawn = now;
        if (spawnInterval > 450) spawnInterval -= 8; // makin cepat
      }
    }

    // ====== EFFECTS (explosion) ======
    const explosions = [];
    function spawnExplosion(pos){
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(0.25, 12, 12),
        new THREE.MeshBasicMaterial({ color:0xffaa33, transparent:true, opacity:0.8 })
      );
      m.position.copy(pos).add(new THREE.Vector3(0,0.2,0));
      m.userData = { born: performance.now(), dur: 420 };
      scene.add(m); explosions.push(m);
    }

    // ====== GAME STATE ======
    const hud = document.getElementById('hud');
    const startOverlay = document.getElementById('startOverlay');
    const gameoverOverlay = document.getElementById('gameover');
    const finalScoreEl = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let started = false;
    let gameOver = false;
    let score = 0;
    let level = 1;
    let health = 100;

    function updateHUD(){
      hud.textContent = `🎯 Score: ${score} | ❤️ Health: ${health} | ⚡ Level: ${level}`;
    }

    function resetGame(){
      // clear bullets & enemies & explosions
      for (const b of bullets) scene.remove(b); bullets.length = 0;
      for (const e of enemies) scene.remove(e); enemies.length = 0;
      for (const p of explosions) scene.remove(p); explosions.length = 0;
      player.position.set(0,0,0);
      camera.position.set(0,9,13);
      lastSpawn = 0; spawnInterval = 1400;
      score = 0; level = 1; health = 100;
      updateHUD();
      // awal musuh
      for(let i=0;i<3;i++) spawnEnemy();
    }

    function startGame(){
      started = true; gameOver = false;
      startOverlay.style.display = 'none';
      resetGame();
    }

    function endGame(){
      started = false; gameOver = true;
      finalScoreEl.textContent = `Score: ${score} | Level: ${level}`;
      gameoverOverlay.style.display = 'grid';
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', () => {
      gameoverOverlay.style.display = 'none';
      startGame();
    });

    // ====== UTILS ======
    const BOUND = 24;
    function clampPlayer(){
      player.position.x = Math.max(-BOUND, Math.min(BOUND, player.position.x));
      player.position.z = Math.max(-BOUND, Math.min(BOUND, player.position.z));
    }

    // ====== MAIN LOOP ======
    function loop(nowMs){
      requestAnimationFrame(loop);

      if (started && !gameOver){
        // Movement
        const spd = (keys['Shift'] ? 0.18 : 0.12);
        if (keys['w'] || keys['ArrowUp'])    player.position.z -= spd;
        if (keys['s'] || keys['ArrowDown'])  player.position.z += spd;
        if (keys['a'] || keys['ArrowLeft'])  player.position.x -= spd;
        if (keys['d'] || keys['ArrowRight']) player.position.x += spd;
        clampPlayer();

        // Nengok ke mouse (update aim & rotate)
        updateAimPoint();

        // Animasi stickman jalan
        const moving = (keys['w']||keys['ArrowUp']||keys['s']||keys['ArrowDown']||keys['a']||keys['ArrowLeft']||keys['d']||keys['ArrowRight']);
        if(moving){
          const swing = Math.sin(nowMs * 0.008) * 0.6;
          player.userData.armL.rotation.x =  swing;
          player.userData.armR.rotation.x = -swing;
          player.userData.legL.rotation.x = -swing;
          player.userData.legR.rotation.x =  swing;
        } else {
          player.userData.armL.rotation.x *= 0.8;
          player.userData.armR.rotation.x *= 0.8;
          player.userData.legL.rotation.x *= 0.8;
          player.userData.legR.rotation.x *= 0.8;
        }

        // Camera follow
        camera.position.x += (player.position.x - camera.position.x) * 0.08;
        camera.position.z += (player.position.z + 13 - camera.position.z) * 0.08;
        camera.lookAt(player.position);

        // Bullets update
        for (let i=bullets.length-1; i>=0; i--){
          const b = bullets[i];
          b.position.add(b.userData.vel);
          // life & bounds
          if (nowMs - b.userData.born > b.userData.life || Math.abs(b.position.x) > BOUND+5 || Math.abs(b.position.z) > BOUND+5){
            scene.remove(b); bullets.splice(i,1); continue;
          }
        }

        // Enemies move & collisions
        for (let i=enemies.length-1; i>=0; i--){
          const e = enemies[i];
          const dir = new THREE.Vector3().subVectors(player.position, e.position).setY(0).normalize();
          e.position.add(dir.multiplyScalar(e.userData.speed));

          // hit by bullets?
          let killed = false;
          for (let j=bullets.length-1; j>=0; j--){
            const b = bullets[j];
            if (b.position.distanceTo(e.position) < (e.userData.radius + b.userData.radius)){
              // destroy enemy & bullet
              scene.remove(b); bullets.splice(j,1);
              scene.remove(e); enemies.splice(i,1);
              spawnExplosion(e.position);
              score += 1;
              if (score % 12 === 0){ level++; } // naik level tiap 12 kill
              updateHUD();
              killed = true;
              break;
            }
          }
          if (killed) continue;

          // collide with player?
          if (e.position.distanceTo(player.position) < (e.userData.radius + 0.6)){
            scene.remove(e); enemies.splice(i,1);
            spawnExplosion(player.position);
            health -= 20;
            if (health <= 0){ health = 0; updateHUD(); endGame(); break; }
            updateHUD();
          }
        }

        // Explosions update
        for (let i=explosions.length-1; i>=0; i--){
          const p = explosions[i]; const t = (nowMs - p.userData.born) / p.userData.dur;
          p.scale.setScalar(1 + t*3);
          p.material.opacity = Math.max(0, 0.8 - t);
          if (t >= 1){ scene.remove(p); explosions.splice(i,1); }
        }

        // Spawner
        tickSpawner(nowMs);
      }

      renderer.render(scene, camera);
    }
    requestAnimationFrame(loop);

    // Resize
    addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
