<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Hacker 3D + Matrix Code Rain</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --neon: #00ffcc;
      --bg: #000000;
    }
    * { box-sizing: border-box; }
    html,body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    /* Layering: 3D di bawah, hujan kode di atasnya, HUD paling atas */
    #layer-3d, #layer-rain { position: fixed; inset: 0; display: block; }
    #layer-rain { pointer-events: none; mix-blend-mode: screen; }
    .hud {
      position: fixed; inset: 20px 20px auto 20px;
      color: var(--neon); text-shadow: 0 0 12px var(--neon);
      letter-spacing: 0.06em; user-select: none; pointer-events: none;
    }
    .hud h1 { margin: 0 0 6px; font-size: clamp(18px, 3vw, 28px); }
    .hud .pill {
      display: inline-block; border: 1px solid var(--neon); border-radius: 999px;
      padding: 6px 10px; font-size: 12px; opacity: .8;
    }
    .corner {
      position: fixed; inset: auto 16px 16px auto; color: #0aff95; font-size: 11px; opacity: .8;
      font-variant-numeric: tabular-nums; pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Three.js -->
  <canvas id="layer-3d"></canvas>
  <!-- Matrix rain overlay -->
  <canvas id="layer-rain"></canvas>

  <!-- HUD -->
  <div class="hud">
    <h1>👨‍💻 HACKER 3D MODE</h1>
    <div class="pill">NEON GRID • MATRIX RAIN • INTERACTIVE PARALLAX</div>
  </div>
  <div class="corner" id="fps">FPS: —</div>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    // ====== THREE.JS 3D NEON WORLD ======
    const canvas3d = document.getElementById('layer-3d');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x001a14, 10, 60);

    const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 200);
    camera.position.set(0, 2.4, 8);

    // Light (neon-ish)
    const key = new THREE.PointLight(0x00ffcc, 2.2, 100); key.position.set(5, 6, 5); scene.add(key);
    const rim = new THREE.PointLight(0x009977, 1.4, 80); rim.position.set(-5, -3, -5); scene.add(rim);
    scene.add(new THREE.AmbientLight(0x004c3f, 0.6));

    // Neon grid plane
    const gridGeo = new THREE.PlaneGeometry(200, 200, 100, 100);
    const gridMat = new THREE.MeshBasicMaterial({ wireframe: true, color: 0x004f42, transparent: true, opacity: 0.5 });
    const grid = new THREE.Mesh(gridGeo, gridMat);
    grid.rotation.x = -Math.PI/2;
    grid.position.y = -2.2;
    scene.add(grid);

    // Floating cubes (digits map to cube sizes for "hacker vibes")
    const cubes = [];
    const baseMat = new THREE.MeshStandardMaterial({
      color: 0x00ffcc, emissive: 0x008877, metalness: 0.3, roughness: 0.2
    });

    const count = 70;
    for (let i = 0; i < count; i++) {
      const s = (Math.random()*0.7 + 0.2);
      const geo = new THREE.BoxGeometry(s, s, s);
      const mesh = new THREE.Mesh(geo, baseMat.clone());
      mesh.position.set(
        (Math.random()-0.5)*30,
        (Math.random()*10 - 1),
        (Math.random()-0.5)*30
      );
      mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
      mesh.userData.spinX = (Math.random()*0.02 + 0.003) * (Math.random() < 0.5 ? -1 : 1);
      mesh.userData.spinY = (Math.random()*0.02 + 0.003);
      mesh.userData.float = Math.random()*0.01 + 0.002;
      scene.add(mesh);
      cubes.push(mesh);
    }

    // Subtle neon particles (points)
    const pCount = 600;
    const positions = new Float32Array(pCount*3);
    for (let i=0;i<pCount;i++){
      positions[i*3+0] = (Math.random()-0.5)*50;
      positions[i*3+1] = Math.random()*12 - 1.5;
      positions[i*3+2] = (Math.random()-0.5)*50;
    }
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const pMat = new THREE.PointsMaterial({ color: 0x00ffcc, size: 0.05, transparent: true, opacity: 0.8 });
    const points = new THREE.Points(pGeo, pMat);
    scene.add(points);

    // Mouse parallax
    let targetRotX = 0, targetRotY = 0;
    window.addEventListener('pointermove', (e) => {
      const nx = (e.clientX / innerWidth) * 2 - 1;
      const ny = (e.clientY / innerHeight) * 2 - 1;
      targetRotY = nx * 0.25;
      targetRotX = ny * 0.15;
    });

    // Resize
    function onResize(){
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      // Rain canvas resized below
      resizeRain();
    }
    addEventListener('resize', onResize);

    // ====== MATRIX CODE RAIN (Canvas 2D Overlay) ======
    const rain = document.getElementById('layer-rain');
    const rCtx = rain.getContext('2d');

    let columns, drops, fontSize;
    const glyphs = 'アカサタナハマヤラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$<>+-*/?=';

    function initRain() {
      fontSize = Math.max(14, Math.floor(innerWidth / 90));
      rain.width = innerWidth;
      rain.height = innerHeight;
      columns = Math.floor(rain.width / fontSize);
      drops = Array(columns).fill(0).map(()=> Math.floor(Math.random()*rain.height/fontSize));
      rCtx.font = fontSize + 'px monospace';
    }
    function resizeRain(){ initRain(); }

    function drawRain() {
      // trail fade
      rCtx.fillStyle = 'rgba(0, 20, 16, 0.25)';
      rCtx.fillRect(0, 0, rain.width, rain.height);

      for (let i=0;i<drops.length;i++){
        const text = glyphs.charAt(Math.floor(Math.random()*glyphs.length));
        // Glow head
        rCtx.shadowColor = '#00ffcc';
        rCtx.shadowBlur = 12;
        rCtx.fillStyle = '#00ffcc';
        rCtx.fillText(text, i*fontSize, drops[i]*fontSize);

        // Tail
        rCtx.shadowBlur = 0;
        rCtx.fillStyle = 'rgba(0,255,200,0.35)';
        rCtx.fillText(text, i*fontSize, (drops[i]-1)*fontSize);

        // Move drop
        drops[i]++;
        // Reset with randomness to create varied lengths
        if (drops[i]*fontSize > rain.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
      }
    }

    initRain();

    // ====== ANIMATE LOOP ======
    const fpsEl = document.getElementById('fps');
    let last = performance.now(), frames = 0, fpsTime = 0;

    function animate(now){
      requestAnimationFrame(animate);

      // Camera subtle follow / parallax
      camera.rotation.x += (targetRotX - camera.rotation.x) * 0.05;
      camera.rotation.y += (targetRotY - camera.rotation.y) * 0.05;

      // Wiggle grid
      grid.material.color.offsetHSL(0.0005, 0, 0);

      // Float cubes + spin
      for (const c of cubes){
        c.rotation.x += c.userData.spinX;
        c.rotation.y += c.userData.spinY;
        c.position.y += Math.sin(now * 0.001 + c.position.x)*0.0006 + c.userData.float;
        if (c.position.y > 6) c.position.y = -2 - Math.random()*2;
      }

      // Subtle particle drift
      points.rotation.y += 0.0008;

      renderer.render(scene, camera);
      drawRain();

      // FPS meter (lightweight)
      frames++; const delta = now - last; fpsTime += delta; last = now;
      if (fpsTime >= 500){
        const fps = Math.round((frames / fpsTime) * 1000);
        fpsEl.textContent = 'FPS: ' + fps;
        frames = 0; fpsTime = 0;
      }
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
